apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

    exporters:
      prometheus:
        endpoint: "0.0.0.0:{{ .Values.otelcol.ports.prometheusExporter }}"
      debug:
        verbosity: normal

    service:
      telemetry:
        metrics:
          address: 0.0.0.0:{{ .Values.otelcol.ports.metrics }}
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
