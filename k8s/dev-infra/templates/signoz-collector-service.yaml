apiVersion: v1
kind: Service
metadata:
  name: signoz-collector
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: signoz-collector
  ports:
    - name: grpc
      port: {{ .Values.signoz.collector.grpcPort }}
      targetPort: 4317
    - name: http
      port: {{ .Values.signoz.collector.httpPort }}
      targetPort: 4318
  type: ClusterIP
