namespace: dev

postgres:
  image: postgres:17
  user: dev
  password: dev
  db: mydb
  storage: 2Gi
  port: 5432

rabbitmq:
  image: rabbitmq:4-management
  user: dev
  password: dev
  storage: 1Gi
  ports:
    amqp: 5672
    management: 15672

redis:
  image: redis:7-alpine
  password: dev
  storage: 1Gi
  port: 6379

prometheus:
  image: prom/prometheus:v3.2.1
  storage: 5Gi
  port: 9090

otelcol:
  image: otel/opentelemetry-collector-contrib:0.119.0
  ports:
    grpc: 4317
    http: 4318
    metrics: 8888
    prometheusExporter: 8889
